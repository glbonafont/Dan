  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--bg); color-scheme: dark; }

  /* Foto de fons en blanc i negre, amb la mateixa capa fosca que Bonafont.dev */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(rgba(0,0,0,.68), rgba(0,0,0,.68)),
      var(--photo) 55% 40% / cover no-repeat,
      var(--bg);
    filter: grayscale(1);
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--fg);
    font-family: "Quicksand", "Nunito", "Varela Round", sans-serif;
    padding: clamp(2rem, 9vh, 5.5rem) var(--pad) calc(var(--dock-space) + env(safe-area-inset-bottom));
  }

  .col { width: min(720px, 100%); margin-inline: auto; }

  button, input { font: inherit; color: inherit; }

  /* ---------- Cerca (compositor) ---------- */
  .composer {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .6rem .6rem .6rem 1.35rem;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .28);
    border-radius: 24px;
    transition: border-color .25s ease;
    animation: rise .9s var(--ease) .1s both;
  }
  .composer:focus-within { border-color: rgba(255, 255, 255, .7); }

  .composer input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--fg);
    font: 400 clamp(1.05rem, 1.8vw, 1.25rem) / 1.5 "Quicksand", "Nunito", sans-serif;
    padding: .6rem 0;
  }
  .composer input::placeholder { color: #9a9a9a; }
  .composer input::-webkit-search-cancel-button { display: none; }

  .clear {
    display: none;
    flex: none;
    width: 36px; height: 36px;
    place-items: center;
    background: none; border: 0; border-radius: 50%;
    color: var(--muted); cursor: pointer;
    transition: color .25s ease, background .25s ease;
  }
  .composer.has-text .clear { display: grid; }
  .clear:hover { color: var(--fg); background: rgba(255,255,255,.1); }
  .clear svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }

  .mic, .ibtn {
    position: relative;
    flex: none;
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border: 0; border-radius: 16px;
    background: var(--fg); color: var(--bg);
    cursor: pointer;
    transition: opacity .25s ease, transform .25s var(--ease);
  }
  .mic:hover, .ibtn:hover { transform: translateY(-2px); }
  .mic svg, .ibtn svg { width: 22px; height: 22px; }
  .mic[aria-pressed="true"] { animation: ring 1.3s ease-out infinite; }

  :where(.mic, .ibtn, .chip, .ghost, .track, .clear):focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  /* ---------- Chips (idioma de la veu) ---------- */
  .chips {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: .6rem; margin-top: 1rem;
  }
  .chip {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 500; font-size: 1rem; letter-spacing: .06em;
    color: var(--fg);
    background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 999px;
    padding: .5rem 1.2rem;
    cursor: pointer;
    transition: background .25s ease, color .25s ease, border-color .25s ease, transform .25s var(--ease);
    animation: rise .8s var(--ease) calc(.35s + var(--i) * .08s) both;
  }
  .chip:hover { background: rgba(255, 255, 255, .14); border-color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .status {
    min-height: 1.6em; margin-top: 1rem;
    text-align: center; color: var(--muted); font-size: 1rem;
  }
  .status strong { color: var(--fg); font-weight: 500; }

  /* ---------- Llista de cançons ---------- */
  .tracks { list-style: none; margin-top: 1.5rem; }
  .tracks.intro li { animation: rise .7s var(--ease) calc(var(--i) * .1s) both; }
  .tracks li { border-top: 1px solid var(--line); }
  .tracks li:last-child { border-bottom: 1px solid var(--line); }

  .track {
    display: grid;
    grid-template-columns: clamp(2.6rem, 9vw, 4rem) 52px 1fr;
    gap: 0 1rem;
    align-items: center;
    width: 100%;
    padding: .9rem .4rem;
    background: none; border: 0; text-align: left; cursor: pointer;
    transition: background .25s ease;
  }
  .track:hover { background: rgba(255, 255, 255, .06); }

  .idx {
    display: grid; place-items: center; height: 2rem;
    font-family: "Oswald", sans-serif; font-weight: 700;
    font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1; letter-spacing: -.01em;
    opacity: .35;
    transition: opacity .25s ease;
  }
  .track[aria-current="true"] .idx { opacity: 1; }

  .eq { display: none; align-items: flex-end; justify-content: center; gap: 3px; height: 26px; }
  .eq i { width: 4px; height: 30%; background: var(--fg); border-radius: 2px; animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s; }
  .eq i:nth-child(3) { animation-delay: -.6s; }
  body.playing .track[aria-current="true"] .eq { display: flex; }
  body.playing .track[aria-current="true"] .num { display: none; }

  .cover {
    width: 52px; height: 52px; flex: none;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, .3);
    background-size: cover; background-position: center;
    filter: grayscale(1);
  }
  /* Quan la cançó no té caràtula, els mateixos teixits que Bonafont.dev */
  .cover.p0 { background-color: #fff; }
  .cover.p1 { background-color: #0a0a0a;
              background-image:
                repeating-linear-gradient(0deg, transparent 0 11px, rgba(255,255,255,.18) 11px 12px),
                repeating-linear-gradient(90deg, transparent 0 11px, rgba(255,255,255,.18) 11px 12px); }
  .cover.p2 { background: radial-gradient(circle at 80% 20%, transparent 0 18%, rgba(255,255,255,.35) 18.4% 22%, transparent 22.4% 40%, rgba(255,255,255,.25) 40.4% 44%, transparent 44.4%), #151515; }
  .cover.p3 { background-color: #d9d9d9; }

  .t-title { display: block; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 1.25rem; letter-spacing: .03em; line-height: 1.25; overflow-wrap: anywhere; }
  .t-sub { display: block; color: var(--muted); font-size: 1rem; margin-top: .15rem; }
  .empty { padding: 2rem 0; text-align: center; color: var(--muted); }

  /* ---------- Reproductor persistent ---------- */
  .player {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(var(--pad) + env(safe-area-inset-bottom));
    z-index: 20;
    padding-inline: var(--pad);
    pointer-events: none;
  }
  .player-in {
    pointer-events: auto;
    width: min(720px, 100%); margin-inline: auto;
    padding: .9rem 1rem 1rem;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    grid-template-areas: "meta ctrls right" "seek seek seek";
    gap: .6rem 1rem; align-items: center;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .28);
    border-radius: 24px;
    animation: rise .9s var(--ease) .2s both;
  }
  .meta { grid-area: meta; display: flex; align-items: center; gap: .75rem; min-width: 0; }
  .meta .cover { width: 46px; height: 46px; border-radius: 12px; }
  .meta-t { min-width: 0; }
  .now-title { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 1.05rem; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-sub { color: var(--muted); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ctrls { grid-area: ctrls; display: flex; align-items: center; gap: .4rem; }
  .ghost {
    width: 42px; height: 42px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%; color: var(--fg); cursor: pointer;
    transition: background .25s ease, transform .25s var(--ease);
  }
  .ghost:hover { background: rgba(255, 255, 255, .14); }
  .ghost svg { width: 22px; height: 22px; }

  .right { grid-area: right; display: flex; align-items: center; justify-content: flex-end; gap: .75rem; }
  .loop {
    display: inline-flex; align-items: center; gap: .5rem;
    font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 500;
    font-size: .9rem; letter-spacing: .06em; white-space: nowrap;
    color: var(--fg);
    background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 999px; padding: .4rem 1rem; cursor: pointer;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  .loop:hover { background: rgba(255, 255, 255, .14); border-color: var(--fg); }
  .loop[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .loop svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .loop .one { display: none; }
  .loop[aria-pressed="true"] .one { display: block; }
  .loop[aria-pressed="true"] .all { display: none; }
  :where(.loop):focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  .vol { display: flex; align-items: center; color: var(--muted); }
  .vol input { width: 76px; }

  .seek {
    grid-area: seek;
    display: grid; grid-template-columns: 2.8rem 1fr 2.8rem; align-items: center; gap: .6rem;
    font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .seek span:last-child { text-align: right; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 20px; background: none; cursor: pointer; --p: 0%;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--fg) var(--p), rgba(255,255,255,.25) var(--p)); }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); }
  input[type=range]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--fg); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--fg); border: 0; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--fg); border: 0; }
  input[type=range]:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 8px; }

  @media (max-width: 640px) {
    :root { --dock-space: 270px; }
    .player-in {
      grid-template-columns: 1fr auto;
      grid-template-areas: "meta meta" "seek seek" "right ctrls";
    }
    .right { justify-content: flex-start; }
    .vol { display: none; }
    .track { gap: 0 .75rem; grid-template-columns: 2.4rem 46px 1fr; }
    .track .cover { width: 46px; height: 46px; }
  }

  /* ---------- Animacions ---------- */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); } 100% { box-shadow: 0 0 0 16px rgba(255,255,255,0); } }

  @media (prefers-reduced-motion: reduce) {
    .composer, .chip, .player-in, .tracks.intro li { animation-name: fade; }
    .eq i { animation: none; height: 70%; }
    .mic[aria-pressed="true"] { animation: none; }
    .mic:hover, .ibtn:hover { transform: none; }
  }

  ::selection { background: var(--fg); color: var(--bg); }
</style>
</head>
<body>

<main class="col">
  <form class="composer" id="composer" role="search" autocomplete="off">
    <label for="q" hidden>Cercar cançons</label>
    <input id="q" type="search" placeholder="Cerca una cançó…" enterkeyhint="search">
    <button class="clear" id="clear" type="button" aria-label="Esborrar la cerca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="mic" id="mic" type="button" aria-pressed="false" aria-label="Cercar per veu" title="Cercar per veu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </form>

  <div class="chips" id="langs" role="group" aria-label="Idioma de la veu">
    <button class="chip" type="button" style="--i:0" data-lang="ca-ES" aria-pressed="false">Català</button>
    <button class="chip" type="button" style="--i:1" data-lang="es-ES" aria-pressed="false">Castellano</button>
    <button class="chip" type="button" style="--i:2" data-lang="en-US" aria-pressed="false">English</button>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <ul class="tracks intro" id="list" aria-label="Cançons"></ul>
</main>

<!-- Reproductor persistent -->
<section class="player" aria-label="Reproductor">
  <div class="player-in">
    <div class="meta">
      <div class="cover p0" id="nowCover"></div>
      <div class="meta-t">
        <div class="now-title" id="nowTitle">—</div>
        <div class="now-sub" id="nowSub"></div>
      </div>
    </div>

    <div class="ctrls">
      <button class="ghost" id="prev" type="button" aria-label="Cançó anterior">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
      </button>
      <button class="ibtn" id="play" type="button" aria-label="Reproduir">
        <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button class="ghost" id="next" type="button" aria-label="Cançó següent">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
      </button>
    </div>

    <div class="right">
      <button class="loop" id="loop" type="button" aria-pressed="false">
        <svg class="all" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        <svg class="one" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/><path d="M11 10h1v4"/></svg>
        <span id="loopLabel">Repetir una</span>
      </button>
      <label class="vol">
        <span hidden>Volum</span>
        <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volum">
      </label>
    </div>

    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Posició de la cançó">
      <span id="dur">0:00</span>
    </div>
  </div>
</section>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  'use strict';

  /* =====================================================
     CONFIGURACIÓ
     Els títols es llegeixen de les etiquetes ID3 dels MP3.
     Si alguna cançó no en té (o vols canviar-ne el nom),
     escriu-lo aquí amb l'identificador del fitxer:
       'phjm38': { title: 'Nom de la cançó', artist: 'Artista' },
     ===================================================== */
  const SONGS = [
    'https://files.catbox.moe/phjm38.mp3',
    'https://files.catbox.moe/u5n7th.mp3',
    'https://files.catbox.moe/88ivl0.mp3',
    'https://files.catbox.moe/049vgx.mp3',
    'https://files.catbox.moe/41huab.mp3',
    'https://files.catbox.moe/rb7zkg.mp3'
  ];
  const OVERRIDES = {
    // 'phjm38': { title: '', artist: '', album: '' },
  };

  /* ---------- helpers ---------- */
  const $ = id => document.getElementById(id);
  const audio = $('audio'), list = $('list'), qInput = $('q'), statusEl = $('status');
  const KEY = 'dan.player.v1', META_KEY = 'dan.meta.v1';
  const store = {
    get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
  };
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  const fmt = s => {
    if (!isFinite(s)) return '0:00';
    s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- dades de les cançons ---------- */
  const metaCache = store.get(META_KEY, {});
  const tracks = SONGS.map((url, i) => {
    const id = url.split('/').pop().replace(/\.mp3$/i, '');
    return { i, id, url, cover: null, coverTried: false, ...(metaCache[url] || {}) };
  });
  const titleOf = t => OVERRIDES[t.id]?.title || t.title || `Cançó ${t.i + 1}`;
  const artistOf = t => OVERRIDES[t.id]?.artist || t.artist || '';
  const albumOf = t => OVERRIDES[t.id]?.album || t.album || '';
  const coverAttrs = t => t.cover
    ? { cls: 'cover', style: `background-image:url('${t.cover}')` }
    : { cls: 'cover p' + (t.i % 4), style: '' };

  /* ---------- lectura d'etiquetes ID3 (v2.2, 2.3 i 2.4) ---------- */
  const synch = (b, o) => (b[o] << 21) | (b[o + 1] << 14) | (b[o + 2] << 7) | b[o + 3];
  const u32 = (b, o) => ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
  const ascii = (b, o, n) => String.fromCharCode(...b.subarray(o, o + n));

  function decodeText(body, start = 1, enc = body[0]) {
    let bytes = body.subarray(start), label = 'iso-8859-1';
    if (enc === 1) {
      if (bytes[0] === 0xFE && bytes[1] === 0xFF) { label = 'utf-16be'; bytes = bytes.subarray(2); }
      else if (bytes[0] === 0xFF && bytes[1] === 0xFE) { label = 'utf-16le'; bytes = bytes.subarray(2); }
      else label = 'utf-16le';
    } else if (enc === 2) label = 'utf-16be';
    else if (enc === 3) label = 'utf-8';
    return new TextDecoder(label).decode(bytes).replace(/\0+$/g, '').split('\0')[0].trim();
  }

  function parseID3(buf) {
    const b = new Uint8Array(buf), out = {};
    if (b.length < 10 || ascii(b, 0, 3) !== 'ID3') return out;
    const ver = b[3], flags = b[5], end = Math.min(10 + synch(b, 6), b.length);
    let pos = 10;
    if ((flags & 0x40) && ver >= 3) pos += ver === 4 ? synch(b, pos) : u32(b, pos) + 4;
    const hl = ver === 2 ? 6 : 10;
    const names = ver === 2
      ? { TT2: 'title', TP1: 'artist', TAL: 'album', PIC: 'pic' }
      : { TIT2: 'title', TPE1: 'artist', TALB: 'album', APIC: 'pic' };
    while (pos + hl <= end) {
      const id = ascii(b, pos, ver === 2 ? 3 : 4);
      const len = ver === 2 ? (b[pos + 3] << 16 | b[pos + 4] << 8 | b[pos + 5])
                : ver === 4 ? synch(b, pos + 4) : u32(b, pos + 4);
      if (!/^[A-Z0-9]{3,4}$/.test(id) || len <= 0) break;
      const s = pos + hl;
      if (s + len > b.length) break;                    // fotograma fora del buffer
      const body = b.subarray(s, s + len), key = names[id];
      if (key && key !== 'pic') out[key] = decodeText(body);
      if (key === 'pic' && !out.cover) {
        try {
          const enc = body[0]; let i = 1, mime;
          if (ver === 2) { mime = 'image/' + ascii(body, 1, 3).toLowerCase().replace('jpg', 'jpeg'); i = 4; }
          else { let z = i; while (body[z] !== 0) z++; mime = ascii(body, i, z - i) || 'image/jpeg'; i = z + 1; }
          i++;                                           // tipus d'imatge
          if (enc === 0 || enc === 3) { while (body[i] !== 0) i++; i++; }
          else { while (!(body[i] === 0 && body[i + 1] === 0)) i += 2; i += 2; }
          out.cover = URL.createObjectURL(new Blob([body.subarray(i)], { type: mime }));
        } catch {}
      }
      pos = s + len;
    }
    return out;
  }

  async function readHead(url, limit) {
    const res = await fetch(url, { headers: { Range: `bytes=0-${limit - 1}` } });
    const reader = res.body.getReader(), chunks = []; let got = 0;
    while (got < limit) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
    }
    reader.cancel().catch(() => {});
    const all = new Uint8Array(Math.min(got, limit)); let o = 0;
    for (const c of chunks) { const part = c.subarray(0, all.length - o); all.set(part, o); o += part.length; if (o >= all.length) break; }
    return all.buffer;
  }

  async function loadMeta(t) {
    if (t.title || OVERRIDES[t.id]?.title) return;
    try {
      const tags = parseID3(await readHead(t.url, 256 * 1024));
      Object.assign(t, { title: tags.title, artist: tags.artist, album: tags.album });
      if (tags.cover) { t.cover = tags.cover; t.coverTried = true; }
      metaCache[t.url] = { title: t.title, artist: t.artist, album: t.album };
      store.set(META_KEY, metaCache);
      renderList(); renderNow();
    } catch { /* sense CORS o sense etiquetes: es manté el nom per defecte */ }
  }
  async function loadCover(t) {
    if (t.cover || t.coverTried) return;
    t.coverTried = true;
    try {
      const tags = parseID3(await readHead(t.url, 2 * 1024 * 1024));
      if (tags.cover) { t.cover = tags.cover; renderList(); renderNow(); setMediaSession(); }
    } catch {}
  }

  /* ---------- cerca ---------- */
  function search(q, loose = false) {
    const tokens = norm(q).split(' ').filter(Boolean);
    if (!tokens.length) return tracks.slice();
    const scored = tracks.map(t => {
      const hay = norm([titleOf(t), artistOf(t), albumOf(t), t.id, 'canco ' + (t.i + 1)].join(' '));
      return { t, s: tokens.filter(k => hay.includes(k)).length / tokens.length };
    });
    let hits = scored.filter(x => x.s === 1);
    if (!hits.length && loose) hits = scored.filter(x => x.s >= 0.5);
    return hits.sort((a, b) => b.s - a.s || a.t.i - b.t.i).map(x => x.t);
  }

  /* ---------- estat ---------- */
  const saved = store.get(KEY, {});
  let current = Math.max(0, tracks.findIndex(t => t.url === saved.url));
  let loopOne = !!saved.loop;
  let lang = saved.lang || 'ca-ES';
  let query = '';
  let resumeAt = saved.time || 0;

  audio.volume = saved.vol ?? 0.8;
  $('vol').value = Math.round(audio.volume * 100);
  const persist = () => store.set(KEY, {
    url: tracks[current].url, time: audio.currentTime || 0, loop: loopOne, vol: audio.volume, lang
  });

  /* ---------- render ---------- */
  function renderList() {
    const items = search(query);
    $('composer').classList.toggle('has-text', !!qInput.value);
    if (!items.length) {
      list.innerHTML = `<li class="empty">Cap cançó coincideix amb «${esc(query)}».</li>`;
      return;
    }
    list.innerHTML = items.map((t, n) => {
      const c = coverAttrs(t);
      return `
      <li style="--i:${n}"><button class="track" type="button" data-i="${t.i}" ${t.i === current ? 'aria-current="true"' : ''}>
        <span class="idx"><span class="num">${t.i + 1}</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></span>
        <span class="${c.cls}" style="${esc(c.style)}"></span>
        <span><span class="t-title">${esc(titleOf(t))}</span>${artistOf(t) ? `<span class="t-sub">${esc(artistOf(t))}${albumOf(t) ? ' · ' + esc(albumOf(t)) : ''}</span>` : ''}</span>
      </button></li>`;
    }).join('');
  }
  function renderNow() {
    const t = tracks[current], c = coverAttrs(t);
    $('nowTitle').textContent = titleOf(t);
    $('nowSub').textContent = artistOf(t) || `Cançó ${t.i + 1} de ${tracks.length}`;
    $('nowCover').className = c.cls; $('nowCover').setAttribute('style', c.style);
    document.title = (audio.paused ? '' : '▶ ') + titleOf(t) + ' · dan';
  }
  function renderPlayState() {
    const playing = !audio.paused;
    document.body.classList.toggle('playing', playing);
    $('icoPlay').style.display = playing ? 'none' : '';
    $('icoPause').style.display = playing ? '' : 'none';
    $('play').setAttribute('aria-label', playing ? 'Pausar' : 'Reproduir');
    renderNow();
  }
  function renderLoop() {
    $('loop').setAttribute('aria-pressed', String(loopOne));
    $('loopLabel').textContent = loopOne ? 'Repetint una' : 'Repetir una';
    $('loop').title = loopOne ? 'Torna a la llista completa' : 'Repetir només aquesta cançó';
    audio.loop = loopOne;
  }
  const setRange = (el, pct) => el.style.setProperty('--p', pct + '%');

  /* ---------- reproducció ---------- */
  function load(i, startAt = 0) {
    current = (i + tracks.length) % tracks.length;
    resumeAt = startAt;
    audio.src = tracks[current].url;
    renderNow(); renderList(); loadCover(tracks[current]); setMediaSession(); persist();
  }
  function playIndex(i) {
    if (i === current && audio.src) { toggle(); return; }
    load(i);
    tryPlay();
  }
  let intent = false, fails = 0;                       // intent: l'usuari ha demanat reproduir
  const tryPlay = () => { intent = true; return audio.play().catch(() => {}); };
  const next = () => { load(current + 1); tryPlay(); };
  const prev = () => {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    load(current - 1); tryPlay();
  };
  const toggle = () => { if (audio.paused) tryPlay(); else { intent = false; audio.pause(); } };
  const toggleLoop = () => { loopOne = !loopOne; renderLoop(); persist(); };

  function setMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const t = tracks[current];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: titleOf(t), artist: artistOf(t) || 'dan', album: albumOf(t),
      artwork: t.cover ? [{ src: t.cover, sizes: '512x512' }] : []
    });
  }
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    ms.setActionHandler('play', tryPlay);
    ms.setActionHandler('pause', () => audio.pause());
    ms.setActionHandler('previoustrack', prev);
    ms.setActionHandler('nexttrack', next);
    try { ms.setActionHandler('seekto', e => { audio.currentTime = e.seekTime; }); } catch {}
  }

  /* ---------- esdeveniments de l'àudio ---------- */
  let dragging = false, lastSave = 0;
  audio.addEventListener('play', renderPlayState);
  audio.addEventListener('playing', () => { fails = 0; });
  audio.addEventListener('pause', () => { renderPlayState(); persist(); });
  audio.addEventListener('loadedmetadata', () => {
    if (resumeAt > 0 && resumeAt < audio.duration) audio.currentTime = resumeAt;
    resumeAt = 0;
    $('dur').textContent = fmt(audio.duration);
  });
  audio.addEventListener('timeupdate', () => {
    if (!dragging && audio.duration) {
      const p = (audio.currentTime / audio.duration) * 1000;
      $('seek').value = p; setRange($('seek'), p / 10);
    }
    $('cur').textContent = fmt(audio.currentTime);
    if (Date.now() - lastSave > 1000) { lastSave = Date.now(); persist(); }
  });
  audio.addEventListener('ended', () => { if (!loopOne) next(); });   // en bucle, <audio loop> ja repeteix
  audio.addEventListener('error', () => {
    const name = `<strong>${esc(titleOf(tracks[current]))}</strong>`;
    if (intent && ++fails < tracks.length) {
      say(`No s'ha pogut carregar ${name}. Passo a la següent.`);
      setTimeout(next, 1200);
    } else {
      intent = false;
      say(`No s'ha pogut carregar ${name}. Comprova la connexió.`);
    }
  });

  /* ---------- controls ---------- */
  $('play').onclick = toggle;
  $('next').onclick = next;
  $('prev').onclick = prev;
  $('loop').onclick = toggleLoop;
  $('seek').addEventListener('input', e => {
    dragging = true; setRange(e.target, e.target.value / 10);
    if (audio.duration) $('cur').textContent = fmt(audio.duration * e.target.value / 1000);
  });
  $('seek').addEventListener('change', e => {
    if (audio.duration) audio.currentTime = audio.duration * e.target.value / 1000;
    dragging = false;
  });
  $('vol').addEventListener('input', e => { audio.volume = e.target.value / 100; setRange(e.target, e.target.value); persist(); });
  setRange($('vol'), $('vol').value);

  list.addEventListener('click', e => {
    const b = e.target.closest('.track'); if (b) playIndex(+b.dataset.i);
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,select,textarea,button')) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight') audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
    if (e.code === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
  });

  /* ---------- cerca per text ---------- */
  function say(html) { statusEl.innerHTML = html; }
  function applyQuery(q) {
    query = q; renderList();
    const n = search(q).length;
    say(q ? (n ? `${n} ${n === 1 ? 'cançó' : 'cançons'} per «${esc(q)}»` : '') : '');
  }
  $('composer').addEventListener('submit', e => {
    e.preventDefault();
    const r = search(qInput.value);
    if (r.length) playIndex(r[0].i);
  });
  qInput.addEventListener('input', () => applyQuery(qInput.value));
  qInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { qInput.value = ''; applyQuery(''); }
  });
  $('clear').onclick = () => { qInput.value = ''; applyQuery(''); qInput.focus(); };

  /* ---------- idioma de la veu ---------- */
  const langBtns = [...document.querySelectorAll('#langs .chip')];
  const renderLang = () => langBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  langBtns.forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; renderLang(); persist(); }));
  renderLang();

  /* ---------- cerca per veu ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $('mic');
  if (!SR) {
    mic.hidden = true; $('langs').hidden = true;
  } else {
    let rec = null;
    const PREFIX = /^(posa(m)?|posam|reprodueix|reproduir|toca|busca|cerca|troba|play|pon|pone|reproduce|search|find)\s+(me\s+)?(la\s+|el\s+|l\s+)?(cancon\s+|cancion\s+|song\s+|tema\s+)?(de\s+|d\s+|the\s+)?/;
    const COMMANDS = [
      [/^(pausa|para|atura|stop|pause)$/, () => { intent = false; audio.pause(); }],
      [/^(continua|segueix|reprenc|reanuda|resume|play)$/, tryPlay],
      [/^(seguent|siguiente|next|salta)$/, next],
      [/^(anterior|previous|enrere|atras)$/, prev],
      [/^(bucle|repeteix|repetir|repite|loop|repeat)$/, toggleLoop]
    ];
    function onVoice(raw) {
      const n = norm(raw);
      for (const [re, fn] of COMMANDS) if (re.test(n)) { fn(); say(`Entès: <strong>${esc(raw)}</strong>`); return; }
      const q = n.replace(PREFIX, '').trim();
      qInput.value = q; applyQuery(q);
      const hits = search(q, true);
      if (hits.length) { playIndex(hits[0].i); say(`Reprodueixo <strong>${esc(titleOf(hits[0]))}</strong>`); }
      else say(`No he trobat cap cançó per <strong>${esc(raw)}</strong>.`);
    }
    mic.onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = new SR();
      rec.lang = lang; rec.interimResults = true; rec.maxAlternatives = 3; rec.continuous = false;
      let finalText = '';
      rec.onstart = () => { mic.setAttribute('aria-pressed', 'true'); say('Escoltant…'); };
      rec.onresult = e => {
        let text = '';
        for (const r of e.results) { text += r[0].transcript; if (r.isFinal) finalText = text; }
        qInput.value = text; $('composer').classList.toggle('has-text', !!text);
      };
      rec.onerror = e => {
        say(e.error === 'not-allowed' || e.error === 'service-not-allowed'
          ? 'Cal donar permís al micròfon al navegador.'
          : e.error === 'no-speech' ? 'No he sentit res. Torna-ho a provar.' : 'No he pogut escoltar (' + esc(e.error) + ').');
      };
      rec.onend = () => {
        mic.setAttribute('aria-pressed', 'false'); rec = null;
        if (finalText) onVoice(finalText); else if (!qInput.value) renderList();
      };
      rec.start();
    };
  }

  /* ---------- arrencada ---------- */
  renderLoop(); renderList();
  load(current, resumeAt);
  renderPlayState();
  setTimeout(() => list.classList.remove('intro'), 1600);
  tracks.reduce((p, t) => p.then(() => loadMeta(t)), Promise.resolve());   // etiquetes, una a una
  if (saved.url) say('Continues on ho vas deixar. Prem play.');
})();
</script>
